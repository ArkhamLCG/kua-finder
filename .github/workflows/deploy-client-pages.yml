name: Deploy Client Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "package-lock.json"
      - ".github/workflows/deploy-client-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch published catalog data
        run: node client/scripts/fetch-pages-data.mjs
        env:
          PAGES_DATA_BASE_URL: https://${{ github.repository_owner }}.github.io/kua-finder

      - name: Build client for GitHub Pages
        run: npm run build:pages
        env:
          VITE_YANDEX_METRIKA_ID: ${{ secrets.VITE_YANDEX_METRIKA_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
